services:
  # --- 1. MySQL Relational Database ---
  mysql:
    image: mysql:latest
    container_name: memorygraph-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: memorygraph
      MYSQL_USER: memorygraph
      MYSQL_PASSWORD: memorygraph_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- 2. Redis In-Memory Cache & Session Memory ---
  redis:
    image: redis:latest
    container_name: memorygraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- 3. Apache Kafka (KRaft Single-Node Mode) ---
  kafka:
    image: apache/kafka:latest
    container_name: memorygraph-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # --- 4. FastAPI Backend Application ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memorygraph-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MYSQL_URL=mysql+pymysql://memorygraph:memorygraph_secret@mysql:3306/memorygraph
      - MYSQL_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_ENABLED=true
      - GRAPH_ENABLED=true
      - GRAPH_HOPS=2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - UPLOAD_DIR=/app/data/uploads
      - API_URL=http://api:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # --- 5. Kafka Background Document Processing Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memorygraph-worker
    restart: unless-stopped
    command: ["python", "-m", "services.workers.document_worker"]
    environment:
      - MYSQL_URL=mysql+pymysql://memorygraph:memorygraph_secret@mysql:3306/memorygraph
      - MYSQL_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_ENABLED=true
      - GRAPH_ENABLED=true
      - GRAPH_HOPS=2
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      kafka:
        condition: service_started
      api:
        condition: service_started

  # --- 6. Streamlit Frontend UI ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: memorygraph-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  uploads_data:
