services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: memorygraph-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Render dashboard will prompt you to enter your Groq API key securely
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GRAPH_ENABLED
        value: "true"
      - key: GRAPH_HOPS
        value: "2"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: memorygraph-redis
          property: connectionString
      - key: MYSQL_ENABLED
        value: "false" # Set to true and supply MYSQL_URL for cloud MySQL (e.g. Aiven, TiDB)
      - key: KAFKA_ENABLED
        value: "false" # Set to true and supply KAFKA_BOOTSTRAP_SERVERS for cloud Kafka (e.g. Upstash)

  # 2. Streamlit Frontend Web Service
  - type: web
    name: memorygraph-frontend
    env: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: starter
    envVars:
      - key: PORT
        value: 8501
      - key: API_URL
        fromService:
          type: web
          name: memorygraph-api
          property: url

  # 3. Kafka Asynchronous Worker (Render Background Worker)
  - type: worker
    name: memorygraph-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m services.workers.document_worker
    plan: starter
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GRAPH_ENABLED
        value: "true"
      - key: KAFKA_ENABLED
        value: "false"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: memorygraph-redis
          property: connectionString

# 4. Managed Redis on Render
redis:
  - name: memorygraph-redis
    plan: free
    ipAllowList: []
