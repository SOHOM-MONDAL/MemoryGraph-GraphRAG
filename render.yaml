services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: memorygraph-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Render dashboard will prompt you to enter your Groq API key securely
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GRAPH_ENABLED
        value: "true"
      - key: GRAPH_HOPS
        value: "2"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: memorygraph-redis
          property: connectionString
      - key: MYSQL_ENABLED
        value: "false" # Set to true and supply MYSQL_URL for cloud MySQL (e.g. Aiven, TiDB)
      - key: KAFKA_ENABLED
        value: "false" # Set to true and supply KAFKA_BOOTSTRAP_SERVERS for cloud Kafka (e.g. Upstash)

  # 2. Streamlit Frontend Web Service
  - type: web
    name: memorygraph-frontend
    env: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: free
    envVars:
      - key: PORT
        value: 8501
      - key: API_URL
        value: http://memorygraph-api:8000

  # 3. Managed Redis (Key Value) on Render
  - type: redis
    name: memorygraph-redis
    plan: free
    ipAllowList: []
